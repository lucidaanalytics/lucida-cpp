name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # -fno-exceptions -fno-rtti, -Werror: the core must compile the way Unreal builds plugin code.
      - run: make test CXX=clang++ CC=clang
